<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Result Processing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">Student Examination and Result Processing</h2>
    <div id="results" class="row g-3 mb-3"></div>
    <div id="summary" class="card p-3"></div>
  </div>

  <script>
    // Student records
    const students = [
      { name: "Sara", rollNumber: "BSCS-023", assignment: 18, midterm: 22, finalExam: 42 },
      { name: "Ali", rollNumber: "BSCS-001", assignment: 15, midterm: 20, finalExam: 38 },
      { name: "Ahmed", rollNumber: "BSCS-002", assignment: 12, midterm: 18, finalExam: 32 },
      { name: "Fatima", rollNumber: "BSCS-004", assignment: 10, midterm: 16, finalExam: 30 },
      { name: "Usman", rollNumber: "BSCS-005", assignment: 8, midterm: 12, finalExam: 20 }
    ];

    // Function: total marks
    function calculateTotal(assignment, midterm, finalExam) {
      return assignment + midterm + finalExam;
    }

    // Arrow function: average
    const calculateAverage = (total) => (total / 3).toFixed(2);

    // Function: grade
    function getGrade(total) {
      if (total >= 80) return "A";
      if (total >= 70) return "B";
      if (total >= 60) return "C";
      if (total >= 50) return "D";
      return "F";
    }

    const results = document.getElementById("results");

    // forEach + object destructuring
    students.forEach((student) => {
      const { name, rollNumber, assignment, midterm, finalExam } = student;

      const total = calculateTotal(assignment, midterm, finalExam);
      const status = total >= 50 ? "Passed" : "Failed"; // ternary operator

      results.innerHTML += `
        <div class="col-md-4">
          <div class="card p-3">
            <h5>Student: ${name}</h5>
            Roll No: ${rollNumber}<br><br>
            Assignment: ${assignment}<br>
            Midterm: ${midterm}<br>
            Final Exam: ${finalExam}<br><br>
            Total: ${total}<br>
            Average: ${calculateAverage(total)}<br>
            Grade: ${getGrade(total)}<br>
            Status: ${status}
          </div>
        </div>`;
    });

    // for loop: count passed students
    let passed = 0;
    for (let i = 0; i < students.length; i++) {
      const s = students[i];
      if (calculateTotal(s.assignment, s.midterm, s.finalExam) >= 50) {
        passed++;
      }
    }

    document.getElementById("summary").innerHTML = `
      Total Students: ${students.length}<br>
      Passed Students: ${passed}<br>
      Failed Students: ${students.length - passed}`;
  </script>
</body>
</html>
