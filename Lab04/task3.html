<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Processing System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">Lab 04</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#labNav" aria-controls="labNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="labNav">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1: Student Management</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2: Course Registration</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="task3.html">Task 3: Result Processing</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4: Performance Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center mb-2">Examination &amp; Result Processing</h1>
    <p class="text-center text-muted mb-4">Task 3 — Lab 04</p>

    <div id="results" class="row g-4 mb-4"></div>

    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-bold">Result Summary</div>
      <div id="summary" class="card-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Student records (assignment /20, midterm /30, final exam /50 → total /100)
    const students = [
      { name: "Sara", rollNumber: "BSCS-023", assignment: 18, midterm: 22, finalExam: 42 },
      { name: "Ali", rollNumber: "BSCS-001", assignment: 15, midterm: 20, finalExam: 38 },
      { name: "Ahmed", rollNumber: "BSCS-002", assignment: 12, midterm: 18, finalExam: 32 },
      { name: "Fatima", rollNumber: "BSCS-004", assignment: 10, midterm: 16, finalExam: 30 },
      { name: "Usman", rollNumber: "BSCS-005", assignment: 8, midterm: 12, finalExam: 20 }
    ];

    // Function: total marks
    function calculateTotal(assignment, midterm, finalExam) {
      return assignment + midterm + finalExam;
    }

    // Arrow function: average of the three components
    const calculateAverage = (total) => total / 3;

    // Function: grade from total marks
    function getGrade(total) {
      if (total >= 80) {
        return "A";
      } else if (total >= 70) {
        return "B";
      } else if (total >= 60) {
        return "C";
      } else if (total >= 50) {
        return "D";
      } else {
        return "F";
      }
    }

    const results = document.getElementById("results");

    // forEach to process every student
    students.forEach((student) => {
      // Object destructuring to extract marks
      const { name, rollNumber, assignment, midterm, finalExam } = student;

      const total = calculateTotal(assignment, midterm, finalExam);
      const average = calculateAverage(total);
      const grade = getGrade(total);

      // Ternary operator for Pass/Fail
      const status = total >= 50 ? "Passed" : "Failed";

      // Save the result on the object for the pass count below
      student.status = status;

      const badgeClass = status === "Passed" ? "bg-success" : "bg-danger";

      results.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-header fw-bold">Student: ${name}</div>
            <div class="card-body">
              <p class="mb-3"><strong>Roll No:</strong> ${rollNumber}</p>
              <p class="mb-1"><strong>Assignment:</strong> ${assignment}</p>
              <p class="mb-1"><strong>Midterm:</strong> ${midterm}</p>
              <p class="mb-3"><strong>Final Exam:</strong> ${finalExam}</p>
              <p class="mb-1"><strong>Total:</strong> ${total}</p>
              <p class="mb-1"><strong>Average:</strong> ${average.toFixed(2)}</p>
              <p class="mb-1"><strong>Grade:</strong> ${grade}</p>
              <p class="mb-0"><strong>Status:</strong>
                <span class="badge ${badgeClass}">${status}</span>
              </p>
            </div>
          </div>
        </div>
      `;
    });

    // Additional challenge: for loop to count passed students
    let passedCount = 0;
    for (let i = 0; i < students.length; i++) {
      if (students[i].status === "Passed") {
        passedCount++;
      }
    }

    document.getElementById("summary").innerHTML = `
      <p class="mb-1"><strong>Total Students:</strong> ${students.length}</p>
      <p class="mb-1"><strong>Passed Students:</strong> ${passedCount}</p>
      <p class="mb-0"><strong>Failed Students:</strong> ${students.length - passedCount}</p>
    `;
  </script>
</body>
</html>
