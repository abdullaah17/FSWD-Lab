<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">Lab 04</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#labNav" aria-controls="labNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="labNav">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1: Student Management</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2: Course Registration</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3: Result Processing</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="task4.html">Task 4: Performance Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center mb-2">Student Performance Dashboard</h1>
    <p class="text-center text-muted mb-4">Task 4 — Lab 04</p>

    <div class="row g-4 mb-4">
      <div class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Object Information (for...in)</div>
          <ul id="objectInfo" class="list-group list-group-flush"></ul>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-header fw-bold">Departments</div>
          <div id="departmentInfo" class="card-body"></div>
        </div>
      </div>
    </div>

    <h2 class="h4 mb-3">Students</h2>
    <div id="studentCards" class="row g-4 mb-4"></div>

    <h2 class="h4 mb-3">Final Dashboard Statistics</h2>
    <div id="stats" class="row g-4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 1. ES6 Class
    class Student {
      constructor(name, rollNumber, department, semester, cgpa, marks) {
        this.name = name;
        this.rollNumber = rollNumber;
        this.department = department;
        this.semester = semester;
        this.cgpa = cgpa;
        this.marks = marks;
      }
    }

    // Array of six Student objects created with the class
    const students = [
      new Student("Ali", "BSCS-001", "Computer Science", 6, 3.45, 82),
      new Student("Ahmed", "BSCS-002", "Computer Science", 5, 2.80, 67),
      new Student("Sara", "BSSE-003", "Software Engineering", 4, 3.10, 74),
      new Student("Fatima", "BSIT-004", "Information Technology", 7, 3.70, 91),
      new Student("Usman", "BSCS-005", "Computer Science", 3, 1.75, 45),
      new Student("Ayesha", "BSAI-006", "Artificial Intelligence", 2, 2.40, 58)
    ];

    // 2. Function: grade calculation
    function calculateGrade(marks) {
      if (marks >= 80) {
        return "A";
      } else if (marks >= 70) {
        return "B";
      } else if (marks >= 60) {
        return "C";
      } else if (marks >= 50) {
        return "D";
      } else {
        return "F";
      }
    }

    // 3. Arrow function + ternary: academic status
    const getAcademicStatus = (cgpa) => (cgpa >= 2.0 ? "Eligible" : "Academic Warning");

    // 4. for...in: display the properties of one student object
    const objectInfo = document.getElementById("objectInfo");
    const firstStudent = students[0];
    for (const key in firstStudent) {
      objectInfo.innerHTML += `
        <li class="list-group-item d-flex justify-content-between">
          <span class="text-muted">${key}</span>
          <span class="fw-semibold">${firstStudent[key]}</span>
        </li>
      `;
    }

    // 6. Department management with array methods: push() + includes()
    const departments = [];
    for (const student of students) {
      // for...of over students; only add a department once
      if (!departments.includes(student.department)) {
        departments.push(student.department);
      }
    }

    const departmentInfo = document.getElementById("departmentInfo");
    departmentInfo.innerHTML = departments
      .map((dept) => `<span class="badge bg-secondary me-1 mb-1">${dept}</span>`)
      .join("");
    departmentInfo.innerHTML += `
      <p class="mt-3 mb-0">
        <strong>Offers Artificial Intelligence?</strong>
        ${departments.includes("Artificial Intelligence") ? "Yes" : "No"}
      </p>
    `;

    // 5 & 7. forEach: display every student as a card (with destructuring)
    const studentCards = document.getElementById("studentCards");
    students.forEach((student) => {
      const { name, rollNumber, department, semester, cgpa, marks } = student;
      const grade = calculateGrade(marks);
      const status = getAcademicStatus(cgpa);
      const statusClass = status === "Eligible" ? "bg-success" : "bg-danger";

      studentCards.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">Student: ${name}</div>
            <div class="card-body">
              <p class="mb-1"><strong>Roll No:</strong> ${rollNumber}</p>
              <p class="mb-1"><strong>Department:</strong> ${department}</p>
              <p class="mb-1"><strong>Semester:</strong> ${semester}</p>
              <p class="mb-1"><strong>CGPA:</strong> ${cgpa.toFixed(2)}</p>
              <p class="mb-1"><strong>Marks:</strong> ${marks}</p>
              <p class="mb-1"><strong>Grade:</strong> ${grade}</p>
              <p class="mb-0"><strong>Status:</strong>
                <span class="badge ${statusClass}">${status}</span>
              </p>
            </div>
          </div>
        </div>
      `;
    });

    // Final statistics: for loop to count passed students (marks >= 50)
    let passedStudents = 0;
    for (let i = 0; i < students.length; i++) {
      if (students[i].marks >= 50) {
        passedStudents++;
      }
    }
    const failedStudents = students.length - passedStudents;

    const stats = [
      { label: "Total Students", value: students.length, color: "primary" },
      { label: "Passed Students", value: passedStudents, color: "success" },
      { label: "Failed Students", value: failedStudents, color: "danger" }
    ];

    const statsContainer = document.getElementById("stats");
    stats.forEach(({ label, value, color }) => {
      statsContainer.innerHTML += `
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm border-${color}">
            <div class="card-body">
              <div class="display-6 fw-bold text-${color}">${value}</div>
              <div class="text-muted">${label}</div>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
