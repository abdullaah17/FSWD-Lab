<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Performance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">University Student Performance Dashboard</h2>

    <div class="row g-3 mb-3">
      <div class="col-md-6"><div id="info" class="card p-3 h-100"></div></div>
      <div class="col-md-6"><div id="departments" class="card p-3 h-100"></div></div>
    </div>

    <div id="students" class="row g-3 mb-3"></div>
    <div id="stats" class="card p-3"></div>
  </div>

  <script>
    // 1. ES6 Class
    class Student {
      constructor(name, rollNumber, department, semester, cgpa, marks) {
        this.name = name;
        this.rollNumber = rollNumber;
        this.department = department;
        this.semester = semester;
        this.cgpa = cgpa;
        this.marks = marks;
      }
    }

    // Array of six Student objects
    const students = [
      new Student("Ali", "BSCS-001", "Computer Science", 6, 3.45, 82),
      new Student("Ahmed", "BSCS-002", "Computer Science", 5, 2.8, 67),
      new Student("Sara", "BSSE-003", "Software Engineering", 4, 3.1, 74),
      new Student("Fatima", "BSIT-004", "Information Technology", 7, 3.7, 91),
      new Student("Usman", "BSCS-005", "Computer Science", 3, 1.75, 45),
      new Student("Ayesha", "BSAI-006", "Artificial Intelligence", 2, 2.4, 58)
    ];

    // 2. Function: grade
    function calculateGrade(marks) {
      if (marks >= 80) return "A";
      if (marks >= 70) return "B";
      if (marks >= 60) return "C";
      if (marks >= 50) return "D";
      return "F";
    }

    // 3. Arrow function + ternary operator: academic status
    const getStatus = (cgpa) => cgpa >= 2.0 ? "Eligible" : "Academic Warning";

    // 4. for...in: properties of one student object
    let info = "<h5>Student Object (for...in)</h5>";
    for (const key in students[0]) {
      info += `${key}: ${students[0][key]}<br>`;
    }
    document.getElementById("info").innerHTML = info;

    // 6. Array methods: push() and includes() + for...of
    const departments = ["Computer Science", "Software Engineering", "Information Technology"];
    departments.push("Artificial Intelligence");

    let deptHtml = "<h5>Departments</h5>";
    for (const dept of departments) {
      deptHtml += `${dept}<br>`;
    }
    deptHtml += `<br>Has Artificial Intelligence: ${departments.includes("Artificial Intelligence") ? "Yes" : "No"}`;
    document.getElementById("departments").innerHTML = deptHtml;

    // 5 & 7. forEach + object destructuring: student cards
    const container = document.getElementById("students");
    students.forEach((student) => {
      const { name, rollNumber, department, semester, cgpa, marks } = student;

      container.innerHTML += `
        <div class="col-md-4">
          <div class="card p-3">
            <h5>Student: ${name}</h5>
            Roll No: ${rollNumber}<br>
            Department: ${department}<br>
            Semester: ${semester}<br>
            CGPA: ${cgpa.toFixed(2)}<br>
            Marks: ${marks}<br>
            Grade: ${calculateGrade(marks)}<br>
            Status: ${getStatus(cgpa)}
          </div>
        </div>`;
    });

    // for loop: count passed students (marks >= 50)
    let passed = 0;
    for (let i = 0; i < students.length; i++) {
      if (students[i].marks >= 50) {
        passed++;
      }
    }

    document.getElementById("stats").innerHTML = `
      <h5>Final Dashboard Statistics</h5>
      Total Students: ${students.length}<br>
      Passed Students: ${passed}<br>
      Failed Students: ${students.length - passed}`;
  </script>
</body>
</html>
