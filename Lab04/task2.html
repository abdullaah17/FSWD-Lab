<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Course Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">Online Course Registration System</h2>
    <div id="output" class="card p-4 mx-auto" style="max-width: 500px;"></div>
  </div>

  <script>
    // courses array
    const courses = [
      "Web Development",
      "Database Systems",
      "Artificial Intelligence",
      "Computer Networks",
      "Software Engineering",
      "Data Structures"
    ];

    courses.push("Cloud Computing"); // adds at the end
    courses.pop();                   // removes last one (Cloud Computing)
    courses.pop();                   // removes Data Structures to match expected output

    // true if AI is in the array
    const aiAvailable = courses.includes("Artificial Intelligence");

    // counts the courses using for...of
    function getTotalCourses(list) {
      let total = 0;
      for (const course of list) {
        total++;
      }
      return total;
    }

    // arrow function + ternary, 4 or more courses is full time
    const getStudentStatus = (total) => total >= 4 ? "Full-Time" : "Part-Time";

    // forEach to show courses, index + 1 since index starts from 0
    let html = "<h4>Available Courses</h4>";
    courses.forEach((course, index) => {
      html += `${index + 1}. ${course}<br>`;
    });

    const total = getTotalCourses(courses);
    html += `
      <p class="mt-3 mb-1">Total Registered Courses: ${total}</p>
      <p class="mb-1">Artificial Intelligence Available: ${aiAvailable ? "Yes" : "No"}</p>
      <p class="mb-0">Student Status: ${getStudentStatus(total)}</p>`;

    document.getElementById("output").innerHTML = html;
  </script>
</body>
</html>
