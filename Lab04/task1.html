<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Student Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">University Student Management System</h2>
    <div id="students" class="row g-3"></div>
  </div>

  <script>
    // Array of student objects
    const students = [
      { name: "Ali", rollNumber: "BSCS-001", department: "Computer Science", semester: 6, cgpa: 3.45 },
      { name: "Sara", rollNumber: "BSCS-002", department: "Computer Science", semester: 4, cgpa: 2.75 },
      { name: "Ahmed", rollNumber: "BSSE-003", department: "Software Engineering", semester: 5, cgpa: 2.15 },
      { name: "Fatima", rollNumber: "BSIT-004", department: "Information Technology", semester: 3, cgpa: 3.8 },
      { name: "Usman", rollNumber: "BSCS-005", department: "Computer Science", semester: 7, cgpa: 1.85 },
      { name: "Ayesha", rollNumber: "BSAI-006", department: "Artificial Intelligence", semester: 2, cgpa: 2.6 }
    ];

    // Function: academic status
    function getStatus(cgpa) {
      if (cgpa >= 3.0) return "Excellent";
      if (cgpa >= 2.5) return "Good";
      if (cgpa >= 2.0) return "Satisfactory";
      return "Academic Warning";
    }

    // Arrow function + ternary operator: eligibility
    const getEligibility = (cgpa) => cgpa >= 2.0 ? "Eligible" : "Not Eligible";

    const container = document.getElementById("students");

    // forEach + object destructuring
    students.forEach((student) => {
      const { name, rollNumber, department, semester, cgpa } = student;

      container.innerHTML += `
        <div class="col-md-4">
          <div class="card p-3">
            <h5>${name}</h5>
            Roll No: ${rollNumber}<br>
            Department: ${department}<br>
            Semester: ${semester}<br>
            CGPA: ${cgpa.toFixed(2)}<br>
            Status: ${getStatus(cgpa)}<br>
            Eligibility: ${getEligibility(cgpa)}
          </div>
        </div>`;
    });
  </script>
</body>
</html>
