<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">Lab 04</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#labNav" aria-controls="labNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="labNav">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="task1.html">Task 1: Student Management</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2: Course Registration</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3: Result Processing</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4: Performance Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center mb-2">University Student Management System</h1>
    <p class="text-center text-muted mb-4">Task 1 — Lab 04</p>

    <div id="studentList" class="row g-4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Array of student objects
    const students = [
      { name: "Ali", rollNumber: "BSCS-001", department: "Computer Science", semester: 6, cgpa: 3.45 },
      { name: "Sara", rollNumber: "BSCS-002", department: "Computer Science", semester: 4, cgpa: 2.75 },
      { name: "Ahmed", rollNumber: "BSSE-003", department: "Software Engineering", semester: 5, cgpa: 2.15 },
      { name: "Fatima", rollNumber: "BSIT-004", department: "Information Technology", semester: 3, cgpa: 3.80 },
      { name: "Usman", rollNumber: "BSCS-005", department: "Computer Science", semester: 7, cgpa: 1.85 },
      { name: "Ayesha", rollNumber: "BSAI-006", department: "Artificial Intelligence", semester: 2, cgpa: 2.60 }
    ];

    // Function: academic status based on CGPA
    function getAcademicStatus(cgpa) {
      if (cgpa >= 3.0) {
        return "Excellent";
      } else if (cgpa >= 2.5) {
        return "Good";
      } else if (cgpa >= 2.0) {
        return "Satisfactory";
      } else {
        return "Academic Warning";
      }
    }

    // Arrow function + ternary operator: eligibility for next semester
    const checkEligibility = (cgpa) => (cgpa >= 2.0 ? "Eligible" : "Not Eligible");

    const studentList = document.getElementById("studentList");

    // forEach + object destructuring to display each student
    students.forEach((student) => {
      const { name, rollNumber, department, semester, cgpa } = student;

      const status = getAcademicStatus(cgpa);
      const eligibility = checkEligibility(cgpa);
      const badgeClass = eligibility === "Eligible" ? "bg-success" : "bg-danger";

      studentList.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">${name}</div>
            <div class="card-body">
              <p class="mb-1"><strong>Roll No:</strong> ${rollNumber}</p>
              <p class="mb-1"><strong>Department:</strong> ${department}</p>
              <p class="mb-1"><strong>Semester:</strong> ${semester}</p>
              <p class="mb-1"><strong>CGPA:</strong> ${cgpa.toFixed(2)}</p>
              <p class="mb-1"><strong>Status:</strong> ${status}</p>
              <p class="mb-0"><strong>Eligibility:</strong>
                <span class="badge ${badgeClass}">${eligibility}</span>
              </p>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
